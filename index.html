<!doctype html>

    <title>VIAplanner - University of Toronto Timetable Builder</title>

    <meta property="og:type" content="website" />

    <meta property="og:title" content="VIAplanner - University of Toronto Timetable Builder" />

      name="twitter:description"
      content="Build your personalized U of T timetable in seconds. Plan course schedules, avoid conflicts, and export as an image."
    />

    <meta name="google-site-verification" content="Yah4BjtmNTtNbr74lduIGuCtIouLLp_Ie3C6WSNOkdQ" />

        "description": "A timetable builder for University of Toronto students to plan course schedules and avoid time conflicts.",
